name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libjson-c-dev python3 nodejs
      - name: Compile and run tests
        run: make check
      - name: Check extension syntax
        run: node --check --input-type=module < extension/extension.js
